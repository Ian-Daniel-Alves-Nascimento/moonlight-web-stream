name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # Format check
      - name: Rustfmt
        run: cargo fmt --all -- --check

      # Clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Binstall
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Cargo Shear
      - name: Install cargo-shear
        run: cargo binstall --force --no-confirm cargo-shear
      - name: Cargo Shear
        run: cargo shear
  
      # Test
      - name: Test
        run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            app-suffix: .exe

    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
  
    # Install node
    - uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: npm
  
    # Install rust
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: cross-${{ matrix.target }}
  
    # Install cross, wasm-bindgen
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main
    - name: Install Cross
      run: cargo binstall --force cross
    - name: Install Wasm-Bindgen
      run: cargo binstall --no-confirm --force wasm-bindgen-cli@0.2.128
  
    # Build
    - name: Build
      run: |
        cross build --release --target ${{ matrix.target }}
  
        npm ci
        npm run build
        mv dist static
  
        rm -rf web-server
        mv target/${{ matrix.target }}/release/web-server${{ matrix.app-suffix }} web-server${{ matrix.app-suffix }}
  
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: moonlight-web-${{ matrix.target }}
        path: |
          web-server${{ matrix.app-suffix }}
          static

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
  
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
  
    steps:
      - name: Create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-prerelease') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish GitHub Release Artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - build
    - create-release

    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            suffix: .exe

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: moonlight-web-${{ matrix.target }}
          path: dist

      - name: Create archive
        run: |
          mkdir package
          mv dist/web-server${{ matrix.suffix }} package/
          mv dist/static package/

          ARCHIVE="moonlight-web-${{ matrix.target }}"

          if [[ "${{ matrix.suffix }}" == ".exe" ]]; then
            zip -r "$ARCHIVE.zip" package
            echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          else
            tar -czf "$ARCHIVE.tar.gz" package
            echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

